[project]
name = "trn2-matmul-bench"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
description = "Trainium 2 matmul peak microbenchmark — bf16 / fp8 / mxfp8"
dependencies = [
    # Neuron XLA bridge + compiler
    "libneuronxla",
    "neuronx-cc>=2.16",
    # Pin to the build validated against NRT 2.29.x in the Batch environment
    "torch-neuronx==2.9.0.2.13.24727",
    # CPU wheel — XLA/Neuron handles device dispatch, not CUDA
    "torch>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "neuron"
url = "https://pip.repos.neuron.amazonaws.com"
explicit = true

[tool.uv.sources]
libneuronxla  = [{ index = "neuron" }]
neuronx-cc    = [{ index = "neuron" }]
torch         = [{ index = "pytorch-cpu" }]
torch-neuronx = [{ index = "neuron" }]
