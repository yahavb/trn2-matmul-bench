[project]
name = "trn2-matmul-bench"
version = "0.1.0"
# Neuron SDK supports Python 3.10–3.12; Beta 2 image ships Python 3.12.
requires-python = ">=3.10,<3.13"
description = "Trainium 2 matmul peak microbenchmark — bf16 / fp8 / mxfp8"

# Runtime deps (torch + neuronx) come from the Beta 2 Docker environment.
# For local dev outside Docker, install them via the indices below.
dependencies = [
    "torch>=2.1",
    "torch-neuronx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "neuron"
url = "https://pip.repos.neuron.amazonaws.com"
explicit = true

[tool.uv.sources]
torch         = [{ index = "pytorch-cpu" }]
torch-neuronx = [{ index = "neuron" }]

[tool.ruff]
target-version = "py310"
line-length = 120
