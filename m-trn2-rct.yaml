apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaimTemplate
metadata:
  name: m-trn2
spec:
  spec:
    devices:
      requests:
      - name: neurons
        allocationMode: ExactCount
        count: 2
        deviceClassName: neuron.aws.com
        selectors:
        - cel:
            expression: "device.attributes['neuron.aws.com'].instanceType == 'trn2.48xlarge' &&
                (device.attributes['neuron.aws.com'].topology_y == 0 || device.attributes['neuron.aws.com'].topology_y == 1)"
      constraints:
      - requests: ["neurons"]
        matchAttribute: "neuron.aws.com/topology_x"
      config:
      - requests: ["neurons"]
        opaque:
          driver: neuron.aws.com
          parameters:
            apiVersion: neuron.aws.com/v1
            kind: NeuronConfig
            logicalNeuronCore: 2
