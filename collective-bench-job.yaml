apiVersion: batch/v1
kind: Job
metadata:
  name: collective-bench
  namespace: default
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: collective-bench
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: m-trn2
          resourceClaimTemplateName: m-trn2
      containers:
        - name: bench
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - "-exc"
            - |
              set -euxo pipefail

              cd /tmp
              git clone -b feat/trn2-collective-bench https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/trn2-matmul-bench.git
              cd trn2-matmul-bench

              # ─── Run collective benchmark (2 NDs via torchrun) ───────────
              echo "============================================"
              echo "  Collective Ops Benchmark: 2 NDs"
              echo "============================================"

              torchrun --nproc_per_node=8 /tmp/trn2-matmul-bench/collective_benchmark.py \
                --sizes 4096 8192 16384 \
                --warmup 5 \
                --reps 10 \
                --sustain 60 \
                --output /tmp/collective_bench.json \
                2>&1 | tee /tmp/collective_bench.log

              echo ""
              echo "Benchmark results:"
              cat /tmp/collective_bench.json | python3 -m json.tool | tail -40

              # ─── Archive results ─────────────────────────────────────────
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              ARCHIVE_DIR="/var/mdl/collective_bench/runs/${TIMESTAMP}"
              echo ""
              echo "============================================"
              echo "  ARCHIVING to: $ARCHIVE_DIR"
              echo "============================================"
              mkdir -p "$ARCHIVE_DIR"
              cp /tmp/collective_bench.json "$ARCHIVE_DIR/" 2>/dev/null || true
              cp /tmp/collective_bench.log "$ARCHIVE_DIR/" 2>/dev/null || true
              echo "Archive complete!"
              ls -la "$ARCHIVE_DIR/"

              echo "═══════════════════════════════════════════"
              echo "  Done! Collective benchmark complete"
              echo "═══════════════════════════════════════════"
          resources:
            claims:
              - name: m-trn2
            requests:
              cpu: 24
              memory: 256Gi
            limits:
              cpu: 24
              memory: 256Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: 621547421844-ap-southeast-4-pvc
              mountPath: /var/mdl
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NEURON_RT_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_CC_LOG_LEVEL
              value: "ERROR"
            - name: TORCH_NEURONX_LOG_LEVEL
              value: "ERROR"
            - name: NEURON_RT_DBG_INTRA_RDH_CHANNEL_BUFFER_SIZE
              value: "134217728"
            - name: NEURON_FALLBACK_ENABLED
              value: "0"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: GITHUB_TOKEN
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim:
            claimName: 621547421844-ap-southeast-4-pvc
